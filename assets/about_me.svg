<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 340" width="460" height="340">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2040"/>
      <stop offset="100%" stop-color="#0d1530"/>
    </linearGradient>
    <linearGradient id="topBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e94560" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#c73652"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="460" height="340" rx="14" ry="14" fill="url(#cardBg)"/>

  <!-- Top accent border line -->
  <rect x="0" y="0" width="460" height="2" rx="1" fill="url(#topBorder)"/>

  <!-- Subtle inner border -->
  <rect x="1" y="1" width="458" height="338" rx="13" ry="13"
        fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.07"/>

  <!-- Window Controls Row -->
  <circle cx="24" cy="22" r="5.5" fill="#f7768e" opacity="0.9"/>
  <circle cx="42" cy="22" r="5.5" fill="#e0af68" opacity="0.9"/>
  <circle cx="60" cy="22" r="5.5" fill="#9ece6a" opacity="0.9"/>

  <!-- Title bar text -->
  <text x="230" y="26" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="11" fill="#565f89" letter-spacing="0.5">about_me.js</text>

  <!-- Divider -->
  <line x1="0" y1="38" x2="460" y2="38" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- Line number column bg -->
  <rect x="0" y="38" width="40" height="302" fill="#12192e" rx="0"/>

  <!-- Line numbers -->
  <g font-family="'Courier New', Courier, monospace" font-size="12" fill="#3d4461" text-anchor="end">
    <text x="32" y="72">1</text>
    <text x="32" y="96">2</text>
    <text x="32" y="120">3</text>
    <text x="32" y="144">4</text>
    <text x="32" y="168">5</text>
    <text x="32" y="192">6</text>
    <text x="32" y="216">7</text>
    <text x="32" y="240">8</text>
    <text x="32" y="264">9</text>
    <text x="32" y="288">10</text>
    <text x="32" y="312">11</text>
  </g>

  <!-- Code -->
  <g font-family="'Courier New', Courier, monospace" font-size="13.5">

    <!-- Line 1: const leul = { -->
    <text x="52" y="72">
      <tspan fill="#bb9af7">const </tspan>
      <tspan fill="#7aa2f7">leul </tspan>
      <tspan fill="#89ddff">= </tspan>
      <tspan fill="#f7768e">{</tspan>
    </text>

    <!-- Line 2: name -->
    <text x="52" y="96">
      <tspan fill="#2ac3de">  name</tspan>
      <tspan fill="#89ddff">:         </tspan>
      <tspan fill="#9ece6a">"Leul Abiti"</tspan>
      <tspan fill="#565f89">,</tspan>
    </text>

    <!-- Line 3: location -->
    <text x="52" y="120">
      <tspan fill="#2ac3de">  location</tspan>
      <tspan fill="#89ddff">:     </tspan>
      <tspan fill="#9ece6a">"Addis Ababa, ET"</tspan>
      <tspan fill="#565f89">,</tspan>
    </text>

    <!-- Line 4: role -->
    <text x="52" y="144">
      <tspan fill="#2ac3de">  role</tspan>
      <tspan fill="#89ddff">:         </tspan>
      <tspan fill="#9ece6a">"Frontend Developer"</tspan>
      <tspan fill="#565f89">,</tspan>
    </text>

    <!-- Line 5: passion -->
    <text x="52" y="168">
      <tspan fill="#2ac3de">  passion</tspan>
      <tspan fill="#89ddff">:      </tspan>
      <tspan fill="#9ece6a">"Building gorgeous UIs"</tspan>
      <tspan fill="#565f89">,</tspan>
    </text>

    <!-- Line 6: currentFocus -->
    <text x="52" y="192">
      <tspan fill="#2ac3de">  currentFocus</tspan>
      <tspan fill="#89ddff">: </tspan>
      <tspan fill="#f7768e">[</tspan>
      <tspan fill="#9ece6a">"JS"</tspan>
      <tspan fill="#565f89">, </tspan>
      <tspan fill="#9ece6a">"UI/UX Design"</tspan>
      <tspan fill="#f7768e">]</tspan>
      <tspan fill="#565f89">,</tspan>
    </text>

    <!-- Line 7: funFact -->
    <text x="52" y="216">
      <tspan fill="#2ac3de">  funFact</tspan>
      <tspan fill="#89ddff">:       </tspan>
      <tspan fill="#9ece6a">"console.log() debugger"</tspan>
      <tspan fill="#565f89">,</tspan>
    </text>

    <!-- Line 8: contact -->
    <text x="52" y="240">
      <tspan fill="#2ac3de">  contact</tspan>
      <tspan fill="#89ddff">:       </tspan>
      <tspan fill="#9ece6a">"leulabiti97@gmail.com"</tspan>
    </text>

    <!-- Line 9: } -->
    <text x="52" y="264">
      <tspan fill="#f7768e">}</tspan>
      <tspan fill="#89ddff">;</tspan>
    </text>

    <!-- Line 10: blank -->

    <!-- Line 11: comment -->
    <text x="52" y="312" fill="#3d4461" font-style="italic">// Always open to collaborate!</text>

  </g>

  <!-- Blinking cursor on line 11 -->
  <rect x="52" y="298" width="8" height="15" fill="#e94560" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0;0.85" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom accent strip -->
  <rect x="0" y="334" width="460" height="6" rx="0" fill="url(#accent)" opacity="0.6"/>
  <rect x="0" y="330" width="460" height="10" rx="4" fill="url(#accent)" opacity="0.15"/>
</svg>
