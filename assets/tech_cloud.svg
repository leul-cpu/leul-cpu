<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="220">
  <defs>
    <!-- Background Card Gradients -->
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16213e" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f3460" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#e94560" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#e94560" stop-opacity="0.3" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Icon Backdrop Shadow -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600&amp;display=swap');
    
    .tech-label {
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #a8b2d8;
      text-anchor: middle;
      opacity: 0.85;
    }

    @keyframes float-badge {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    .badge-group {
      animation-name: float-badge;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
    }
  </style>

  <!-- Outer Glass Frame -->
  <rect x="10" y="10" width="780" height="200" rx="15" ry="15"
        fill="url(#glassBg)"
        stroke="url(#cardBorder)"
        stroke-width="1.5"
        filter="url(#shadow)" />

  <!-- HTML5 -->
  <g class="badge-group" style="animation-duration: 4s; animation-delay: 0s; transform-origin: 85px 70px;">
    <rect x="60" y="45" width="50" height="50" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="#e34f26" stroke-width="1.2" stroke-opacity="0.4" filter="url(#iconShadow)" />
    <path d="M72 57h26l-2.4 25.3L85 87.5 74.4 82.3 72 57z M85 62h-8.8l.8 8.8h8V62z M85 75.8H80l-.3-3.6h5.3v-2.7H80l-.3-3.6h5.3v9.9z" fill="#e34f26" />
    <text x="85" y="112" class="tech-label">HTML5</text>
  </g>

  <!-- CSS3 -->
  <g class="badge-group" style="animation-duration: 4.5s; animation-delay: 0.5s; transform-origin: 225px 70px;">
    <rect x="200" y="45" width="50" height="50" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="#1572b6" stroke-width="1.2" stroke-opacity="0.4" filter="url(#iconShadow)" />
    <path d="M212 57h26l-2.4 25.3L225 87.5 214.4 82.3 212 57z M225 62h-8.8l.8 8.8h8V62z M225 75.8H220l-.3-3.6h5.3v-2.7H220l-.3-3.6h5.3v9.9z" fill="#1572b6" />
    <text x="225" y="112" class="tech-label">CSS3</text>
  </g>

  <!-- JavaScript -->
  <g class="badge-group" style="animation-duration: 5s; animation-delay: 1s; transform-origin: 365px 70px;">
    <rect x="340" y="45" width="50" height="50" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="#f7df1e" stroke-width="1.2" stroke-opacity="0.4" filter="url(#iconShadow)" />
    <rect x="352" y="57" width="26" height="26" rx="2" fill="#f7df1e" />
    <path d="M366.5 77.2c-.4.5-.9.8-1.5.8-.8 0-1.3-.5-1.3-1.3v-.3h1.2v.3c0 .2.1.4.3.4.2 0 .3-.1.3-.4v-4.8h1.2v4.8c0 1.1-.6 1.8-1.5 1.8zm5.5 0c-.6.6-1.3.8-1.9.8-.9 0-1.6-.5-1.6-1.5h1.2c0 .4.2.6.5.6.3 0 .5-.2.5-.5s-.2-.4-.6-.6c-.7-.3-1.4-.6-1.4-1.5 0-.8.6-1.4 1.5-1.4.6 0 1.2.2 1.6.6l-.6.7c-.3-.2-.6-.4-.9-.4-.3 0-.5.2-.5.4 0 .3.2.4.6.6.8.3 1.4.7 1.4 1.5 0 .9-.6 1.4-1.4 1.4z" fill="#000000" />
    <text x="365" y="112" class="tech-label">JavaScript</text>
  </g>

  <!-- Python -->
  <g class="badge-group" style="animation-duration: 4.2s; animation-delay: 1.5s; transform-origin: 505px 70px;">
    <rect x="480" y="45" width="50" height="50" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="#3776ab" stroke-width="1.2" stroke-opacity="0.4" filter="url(#iconShadow)" />
    <path d="M505 54c-5 0-5 .8-5 2.5v3h5v.5h-7.5c-1.7 0-2.5 1-2.5 3v6.5c0 1.7.8 2.5 2.5 2.5h2v-3c0-2 1.5-3.5 3.5-3.5h7c1.7 0 2.5-.8 2.5-2.5v-4c0-1.7-.8-2.5-2.5-2.5h-5.5z M501 56.5a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z M505 86c5 0 5-.8 5-2.5v-3h-5v-.5h7.5c1.7 0 2.5-1 2.5-3v-6.5c0-1.7-.8-2.5-2.5-2.5h-2v3c0 2-1.5 3.5-3.5 3.5h-7c-1.7 0-2.5.8-2.5 2.5v4c0 1.7.8 2.5 2.5 2.5h5.5z M509 81.5a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z" fill="#3776ab" />
    <text x="505" y="112" class="tech-label">Python</text>
  </g>

  <!-- Java -->
  <g class="badge-group" style="animation-duration: 4.8s; animation-delay: 2s; transform-origin: 645px 70px;">
    <rect x="620" y="45" width="50" height="50" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="#e76f51" stroke-width="1.2" stroke-opacity="0.4" filter="url(#iconShadow)" />
    <!-- Java Cup shape -->
    <path d="M632 64h22c1.7 0 3 1.3 3 3v6c0 4.4-3.6 8-8 8h-9c-4.4 0-8-3.6-8-8v-6c0-1.7 1.3-3 3-3zm22 3h-2v6c0 2.8 2.2 5 5 5s5-2.2 5-5v-6h-8z M636 54c1-1.5 1-3 1-4 M641 53c1.5-2 1.5-4 1.5-5 M646 54c1-1.5 1-3 1-4" fill="none" stroke="#e76f51" stroke-width="2" stroke-linecap="round" />
    <text x="645" y="112" class="tech-label">Java</text>
  </g>

  <!-- MySQL -->
  <g class="badge-group" style="animation-duration: 4.6s; animation-delay: 0.8s; transform-origin: 155px 145px;">
    <rect x="130" y="120" width="50" height="50" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="#00758f" stroke-width="1.2" stroke-opacity="0.4" filter="url(#iconShadow)" />
    <path d="M140 131c0-1.7 6.7-3 15-3s15 1.3 15 3-6.7 3-15 3-15-1.3-15-3zm0 5c0 1.7 6.7 3 15 3s15-1.3 15-3v-4c0 1.7-6.7 3-15 3s-15-1.3-15-3v4zm0 5c0 1.7 6.7 3 15 3s15-1.3 15-3v-4c0 1.7-6.7 3-15 3s-15-1.3-15-3v4z" fill="#00758f" />
    <text x="155" y="187" class="tech-label">MySQL</text>
  </g>

  <!-- Git -->
  <g class="badge-group" style="animation-duration: 4.4s; animation-delay: 1.3s; transform-origin: 295px 145px;">
    <rect x="270" y="120" width="50" height="50" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="#f05032" stroke-width="1.2" stroke-opacity="0.4" filter="url(#iconShadow)" />
    <path d="M295.3 129.2l12.4 12.4c.5.5.5 1.2 0 1.7l-12.4 12.4c-.5.5-1.2.5-1.7 0l-12.4-12.4c-.5-.5-.5-1.2 0-1.7l12.4-12.4c.5-.5 1.2-.5 1.7 0zm-3 8.3v6c.6.3 1 .9 1 1.6 0 1-.8 1.8-1.8 1.8s-1.8-.8-1.8-1.8c0-.7.4-1.3 1-1.6v-6c-.6-.3-1-.9-1-1.6 0-1 .8-1.8 1.8-1.8s1.8.8 1.8 1.8c0 .7-.4 1.3-1 1.6z" fill="#f05032" />
    <text x="295" y="187" class="tech-label">Git</text>
  </g>

  <!-- GitHub -->
  <g class="badge-group" style="animation-duration: 5.2s; animation-delay: 0.3s; transform-origin: 435px 145px;">
    <rect x="410" y="120" width="50" height="50" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="#a8b2d8" stroke-width="1.2" stroke-opacity="0.4" filter="url(#iconShadow)" />
    <path d="M435 129c-8.3 0-15 6.7-15 15 0 6.6 4.3 12.2 10.3 14.2.8.1 1-.3 1-.7v-2.7c-4.2.9-5-2-5-2-.7-1.7-1.7-2.2-1.7-2.2-1.4-.9.1-.9.1-.9 1.5.1 2.3 1.5 2.3 1.5 1.3 2.3 3.5 1.6 4.4 1.2.1-1 .5-1.6 1-2-3.3-.4-6.8-1.7-6.8-7.4 0-1.6.6-3 1.5-4-.1-.4-.7-1.9.1-4 0 0 1.2-.4 4.1 1.5a14.2 14.2 0 0 1 7.8 0c2.9-1.9 4.1-1.5 4.1-1.5.9 2.1.3 3.6.1 4 .9 1 1.5 2.4 1.5 4 0 5.7-3.5 7-6.8 7.4.5.5 1 1.4 1 2.8v4.2c0 .4.3.8 1 .7 6-2 10.3-7.6 10.3-14.2 0-8.3-6.7-15-15-15z" fill="#a8b2d8" />
    <text x="435" y="187" class="tech-label">GitHub</text>
  </g>

  <!-- VS Code -->
  <g class="badge-group" style="animation-duration: 4.7s; animation-delay: 1.8s; transform-origin: 575px 145px;">
    <rect x="550" y="120" width="50" height="50" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="#007acc" stroke-width="1.2" stroke-opacity="0.4" filter="url(#iconShadow)" />
    <!-- VS Code custom logo -->
    <path d="M571.4 133.5l1.8 1 1.5-1.5v22l-1.5-1.5-1.8 1c-.3.2-.7-.1-.7-.5v-20c0-.4.4-.7.7-.5zm2.8 2.2V154.3l6.5-6.5-6.5-6.5zm-5.7 15.6l-5.3-4.5 5.3-4.5v9zm1.3-4.5l12.5-9.3-3.2-2.3-9.3 11.6z M574.2 135.2l9.3 11.6 3.2-2.3-12.5-9.3z" fill="#007acc" />
    <text x="575" y="187" class="tech-label">VS Code</text>
  </g>

  <!-- Canva -->
  <g class="badge-group" style="animation-duration: 4.9s; animation-delay: 2.3s; transform-origin: 715px 145px;">
    <rect x="690" y="120" width="50" height="50" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="#00c4cc" stroke-width="1.2" stroke-opacity="0.4" filter="url(#iconShadow)" />
    <circle cx="715" cy="145" r="13" fill="none" stroke="#00c4cc" stroke-width="2" />
    <path d="M707 145c0-4.4 3.6-8 8-8s8 3.6 8 8" fill="none" stroke="#00c4cc" stroke-width="2" stroke-linecap="round" />
    <text x="715" y="187" class="tech-label">Canva</text>
  </g>

</svg>
