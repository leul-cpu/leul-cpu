<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="320">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a16" />
      <stop offset="50%" stop-color="#121224" />
      <stop offset="100%" stop-color="#1a1a2e" />
    </linearGradient>

    <!-- Liquid Flow Gradients -->
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0f3460" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#e94560" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="wave2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f3460" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#e94560" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f3460" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="wave3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16213e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f3460" stop-opacity="0.9" />
    </linearGradient>

    <!-- Frosted Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Border Highlight Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="70%" stop-color="#e94560" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#e94560" stop-opacity="0.5" />
    </linearGradient>

    <!-- Drop Shadow Filter for Glass Card -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Glow Filter for CPU and Text -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&amp;display=swap');

    .title {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
      letter-spacing: 2px;
    }

    .subtitle {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 16px;
      fill: #e94560;
      letter-spacing: 3px;
    }

    .info-text {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #a8b2d8;
    }

    /* Wave animation */
    @keyframes wave-flow-forward {
      0% { transform: translateX(0); }
      100% { transform: translateX(-1000px); }
    }

    @keyframes wave-flow-backward {
      0% { transform: translateX(0); }
      100% { transform: translateX(1000px); }
    }

    .wave1 {
      animation: wave-flow-forward 16s linear infinite;
    }

    .wave2 {
      animation: wave-flow-backward 12s linear infinite;
    }

    .wave3 {
      animation: wave-flow-forward 24s linear infinite;
    }

    /* CPU core pulse animation */
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 1; filter: drop-shadow(0px 0px 8px #e94560); }
      100% { opacity: 0.3; }
    }

    .cpu-glow {
      animation: pulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Wave Layer 1 (Deep Blue Back) -->
  <g class="wave3">
    <path d="M 0 160 Q 250 120 500 160 T 1000 160 T 1500 160 T 2000 160 L 2000 320 L 0 320 Z" fill="url(#wave3Grad)" />
  </g>

  <!-- Animated Wave Layer 2 (Vibrant Pink Middle) -->
  <g class="wave1">
    <path d="M 0 180 Q 250 150 500 180 T 1000 180 T 1500 180 T 2000 180 L 2000 320 L 0 320 Z" fill="url(#wave1Grad)" />
  </g>

  <!-- Animated Wave Layer 3 (Deep Blue / Pink Front) -->
  <g class="wave2">
    <path d="M 0 170 Q 250 140 500 170 T 1000 170 T 1500 170 T 2000 170 L 2000 320 L 0 320 Z" fill="url(#wave2Grad)" />
  </g>

  <!-- Glass Card Container -->
  <rect x="120" y="60" width="760" height="200" rx="20" ry="20"
        fill="url(#glassGrad)"
        stroke="url(#borderGrad)"
        stroke-width="1.5"
        filter="url(#drop-shadow)" />

  <!-- CPU Icon (Interactive System Glyph) -->
  <g transform="translate(170, 110)">
    <!-- Base Chip outer -->
    <rect x="10" y="10" width="80" height="80" rx="12" fill="#16213e" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15" />
    <rect x="15" y="15" width="70" height="70" rx="8" fill="none" stroke="#e94560" stroke-width="2" stroke-opacity="0.8" />
    
    <!-- CPU Silicon Die -->
    <rect x="30" y="30" width="40" height="40" rx="4" fill="#0f3460" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3" />
    <!-- Glowing core node -->
    <circle cx="50" cy="50" r="10" fill="#e94560" class="cpu-glow" />

    <!-- CPU Pins - Left -->
    <line x1="2" y1="30" x2="10" y2="30" stroke="#e94560" stroke-width="2" />
    <line x1="2" y1="50" x2="10" y2="50" stroke="#e94560" stroke-width="2" />
    <line x1="2" y1="70" x2="10" y2="70" stroke="#e94560" stroke-width="2" />
    
    <!-- CPU Pins - Right -->
    <line x1="90" y1="30" x2="98" y2="30" stroke="#e94560" stroke-width="2" />
    <line x1="90" y1="50" x2="98" y2="50" stroke="#e94560" stroke-width="2" />
    <line x1="90" y1="70" x2="98" y2="70" stroke="#e94560" stroke-width="2" />

    <!-- CPU Pins - Top -->
    <line x1="30" y1="2" x2="30" y2="10" stroke="#e94560" stroke-width="2" />
    <line x1="50" y1="2" x2="50" y2="10" stroke="#e94560" stroke-width="2" />
    <line x1="70" y1="2" x2="70" y2="10" stroke="#e94560" stroke-width="2" />

    <!-- CPU Pins - Bottom -->
    <line x1="30" y1="90" x2="30" y2="98" stroke="#e94560" stroke-width="2" />
    <line x1="50" y1="90" x2="50" y2="98" stroke="#e94560" stroke-width="2" />
    <line x1="70" y1="90" x2="70" y2="98" stroke="#e94560" stroke-width="2" />
  </g>

  <!-- Profile Information (Dashboard Texts) -->
  <!-- Name -->
  <text x="290" y="130" class="title">LEUL ABITI</text>
  <!-- Role -->
  <text x="290" y="160" class="subtitle">FRONTEND DEVELOPER</text>

  <!-- Profile Details / Badges -->
  <g transform="translate(290, 190)">
    <!-- Location Badge -->
    <g transform="translate(0, 0)">
      <text x="0" y="12" class="info-text">📍 Addis Ababa, Ethiopia 🇪🇹</text>
    </g>
    <!-- Focus Badges -->
    <g transform="translate(0, 32)">
      <!-- Badge 1: UI/UX -->
      <rect x="0" y="-14" width="75" height="22" rx="11" fill="rgba(233, 69, 96, 0.15)" stroke="#e94560" stroke-width="1" />
      <text x="12" y="1" font-family="'Outfit', sans-serif" font-size="11" font-weight="600" fill="#e94560">✦ UI/UX</text>

      <!-- Badge 2: Architecture -->
      <rect x="85" y="-14" width="95" height="22" rx="11" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="97" y="1" font-family="'Outfit', sans-serif" font-size="11" font-weight="600" fill="#a8b2d8">✦ Clean Code</text>

      <!-- Badge 3: Open Source -->
      <rect x="190" y="-14" width="105" height="22" rx="11" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="202" y="1" font-family="'Outfit', sans-serif" font-size="11" font-weight="600" fill="#a8b2d8">✦ Open Source</text>
    </g>
  </g>

</svg>
