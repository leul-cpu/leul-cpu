name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # 1. Generate the snake animation
      - name: generate-snake-svg
        uses: Platane/snk@v3
        with:
          github_user_name: leul-cpu
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. Generate View Counter badge
      - name: Generate View Counter
        run: |
          mkdir -p dist
          curl "https://komarev.com/ghpvc/?user=leul-cpu&color=purple" -o dist/views.svg

      # 3. Push all files (snake + views) to the output branch
      - name: push files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
