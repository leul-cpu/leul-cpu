name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # 1. Generate the snake animation
      - name: generate-snake-svg
        uses: Platane/snk@v3
        with:
          github_user_name: leul-cpu
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. Ensure the dist directory exists (it should be created by the previous step, but just in case)
      - name: Ensure dist exists
        run: mkdir -p dist

      # 3. FIX PERMISSIONS: Reclaim the dist folder if it was created by root (common in some Docker-based actions)
      - name: Ensure runner has permissions to dist
        run: sudo chown -R $USER:$USER dist

      # 4. Generate View Counter badge
      - name: Generate View Counter
        run: |
          curl "https://komarev.com/ghpvc/?username=leul-cpu&color=blueviolet&style=for-the-badge" -o dist/views.svg

      # 5. Push all files to the output branch
      - name: push files to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
